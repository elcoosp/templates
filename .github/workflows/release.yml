name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Least privilege: only the release job gets write access to contents.
permissions:
  contents: read

# Never cancel an in-flight release; one release at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Test with 100% coverage gate
        run: pnpm test:cov

      - name: Generate CHANGELOG.md with git-cliff
        uses: orhun/git-cliff-action@v4.9.1
        id: cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract latest release notes
        uses: orhun/git-cliff-action@v4.9.1
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release notes are non-empty
        run: |
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::git-cliff produced empty release notes for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Release notes validated"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.changelog }}
          files: CHANGELOG.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
