name = "mm-nuxt-better-auth-drizzle"
description = "Monorepo member with nuxt, better-auth and drizzle"
kickstart_version = 1
authors = ["elcoosp"]
ignore = [".turbo", "node_modules"]
copy_without_render = [
    "template/app/app.vue",
    "template/app/pages/index.vue",
    "template/app/assets/css/main.css",
]
directory = "template"
post_gen_hooks = [{ name = "Finish setup", path = "scripts/finish_setup.sh" }]

[[variables]]
name = "project_name"
default = "my-proj"
prompt = "Name (kebab-case) of the project"
validation = "^([a-z][a-zA-Z0-9_-]+)$"

[[variables]]
name = "org"
default = "my-org"
prompt = "Name (kebab-case) of the organization"
validation = "^([a-z][a-zA-Z0-9_-]+)$"

[[variables]]
name = "description"
default = "{{project_name}} nuxt app with better-auth and drizzle"
prompt = "Description of the project"

[[variables]]
name = "database"
default = "sqlite"
prompt = "Which database does drizzle target ?"
choices = ["sqlite", "postgres"]
